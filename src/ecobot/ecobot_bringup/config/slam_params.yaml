slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping
    max_laser_range: 8.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    resolution: 0.05
    max_search_radius: 10.0
    min_search_radius: 0.5
    ceres_huber_scale: 0.1
    ceres_initial_trust_region: 1e+10
    ceres_max_num_iterations: 10
    ceres_min_relative_cost_change: 1e-06
