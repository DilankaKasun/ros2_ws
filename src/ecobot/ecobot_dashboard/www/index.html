<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ecobot Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
h1 { font-size: 1.4rem; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.status-dot.connected { background: #00e676; box-shadow: 0 0 8px #00e67688; }
.status-dot.disconnected { background: #ff1744; }
.card { background: #16213e; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.card h2 { font-size: 1rem; margin-bottom: 8px; color: #90caf9; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #ffffff15; }
.stat-row:last-child { border: none; }
.stat-label { color: #90a4ae; }
.stat-value { font-family: 'Courier New', monospace; font-weight: bold; }
.badge { padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
.badge.cmd { background: #00c853; color: #000; }
.badge.rc { background: #ff6d00; color: #000; }
canvas { width: 100%; height: auto; border: 1px solid #ffffff22; border-radius: 4px; touch-action: none; }
.camera-frame { width: 100%; max-height: 360px; object-fit: contain; border-radius: 4px; border: 1px solid #ffffff22; background: #0d1b2a; }
.joystick-container { position: relative; width: 100%; aspect-ratio: 1; max-width: 200px; }
.joystick-container canvas { position: absolute; top: 0; left: 0; }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
button.emergency { background: #d50000; color: white; }
button.emergency:hover { background: #ff1744; }
input[type=range] { width: 100px; }
.camera-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 12px; align-items: start; }
@media (max-width: 700px) { .camera-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1><span class="status-dot disconnected" id="statusDot"></span> ecobot</h1>

<div class="camera-grid">
  <div class="card">
    <h2>Camera Feed</h2>
    <img class="camera-frame" id="cameraFeed" src="" alt="camera feed">
  </div>
  <div>
    <div class="card">
      <h2>Robot Status</h2>
      <div class="stat-row"><span class="stat-label">Position X</span><span class="stat-value" id="posX">0.00</span></div>
      <div class="stat-row"><span class="stat-label">Position Y</span><span class="stat-value" id="posY">0.00</span></div>
      <div class="stat-row"><span class="stat-label">Yaw</span><span class="stat-value" id="posYaw">0.00</span></div>
      <div class="stat-row"><span class="stat-label">Mode</span><span class="badge cmd" id="modeBadge">CMD</span></div>
    </div>
    <div class="card">
      <h2>Velocity</h2>
      <div class="stat-row"><span class="stat-label">Linear</span><span class="stat-value" id="velLinear">0.00</span></div>
      <div class="stat-row"><span class="stat-label">Angular</span><span class="stat-value" id="velAngular">0.00</span></div>
    </div>
  </div>
</div>

<div class="card">
  <h2>Obstacle View</h2>
  <img class="camera-frame" id="obstacleFeed" src="" alt="obstacle view">
</div>

<div class="card">
  <h2>Manual Control</h2>
  <div class="controls">
    <div class="joystick-container">
      <canvas id="joystickCanvas" width="200" height="200"></canvas>
    </div>
    <div>
      <div style="margin-bottom:8px">Speed: <span id="speedLabel">0.30</span></div>
      <input type="range" id="speedSlider" min="0.05" max="1.0" step="0.05" value="0.30">
    </div>
  </div>
  <div style="margin-top:8px">
    <button class="emergency" id="emergencyBtn">EMERGENCY STOP</button>
  </div>
</div>

<script>
const ROS_URL = 'ws://' + location.hostname + ':9090';
const ros = new ROSLIB.Ros({ url: ROS_URL });

const cameraImg = document.getElementById('cameraFeed');
const obstacleImg = document.getElementById('obstacleFeed');

function startMJPEG() {
  cameraImg.src = `http://${location.hostname}:8081/stream.mjpg?_=${Date.now()}`;
  obstacleImg.src = `http://${location.hostname}:8083/obstacle.mjpg?_=${Date.now()}`;
}
cameraImg.onerror = () => setTimeout(startMJPEG, 2000);
obstacleImg.onerror = () => setTimeout(startMJPEG, 2000);
startMJPEG();

ros.on('connection', () => {
  document.getElementById('statusDot').className = 'status-dot connected';
});
ros.on('close', () => {
  document.getElementById('statusDot').className = 'status-dot disconnected';
});
ros.on('error', () => {
  document.getElementById('statusDot').className = 'status-dot disconnected';
});

const cmdVelPub = new ROSLIB.Topic({
  ros, name: '/cmd_vel', messageType: 'geometry_msgs/Twist'
});
const odomSub = new ROSLIB.Topic({
  ros, name: '/odom', messageType: 'nav_msgs/Odometry'
});
const modeSub = new ROSLIB.Topic({
  ros, name: '/run_mode', messageType: 'std_msgs/UInt8'
});

odomSub.subscribe(msg => {
  const p = msg.pose.pose.position;
  const o = msg.pose.pose.orientation;
  const yaw = Math.atan2(2*(o.w*o.z), 1-2*(o.z*o.z));
  document.getElementById('posX').textContent = p.x.toFixed(2);
  document.getElementById('posY').textContent = p.y.toFixed(2);
  document.getElementById('posYaw').textContent = yaw.toFixed(2);
  document.getElementById('velLinear').textContent = msg.twist.twist.linear.x.toFixed(2);
  document.getElementById('velAngular').textContent = msg.twist.twist.angular.z.toFixed(2);
});

modeSub.subscribe(msg => {
  const badge = document.getElementById('modeBadge');
  if (msg.data === 1) {
    badge.textContent = 'CMD';
    badge.className = 'badge cmd';
  } else {
    badge.textContent = 'RC';
    badge.className = 'badge rc';
  }
});

const canvas = document.getElementById('joystickCanvas');
const ctx = canvas.getContext('2d');
let dragging = false;
let joyX = 0, joyY = 0;
const centerX = 100, centerY = 100, radius = 80;

function drawJoystick() {
  ctx.clearRect(0, 0, 200, 200);
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, Math.PI*2);
  ctx.fillStyle = '#0d1b2a';
  ctx.fill();
  ctx.strokeStyle = '#ffffff22';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(centerX + joyX * radius, centerY + joyY * radius, 20, 0, Math.PI*2);
  ctx.fillStyle = dragging ? '#66bbff' : '#4488cc';
  ctx.fill();
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
  const cy = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
  return { x: (cx * scaleX - centerX) / radius, y: (cy * scaleY - centerY) / radius };
}

function publishCmd() {
  const maxSpeed = parseFloat(document.getElementById('speedSlider').value);
  cmdVelPub.publish({
    linear: { x: -joyY * maxSpeed, y: 0, z: 0 },
    angular: { x: 0, y: 0, z: joyX * maxSpeed }
  });
}

let cmdInterval = null;

canvas.addEventListener('mousedown', e => {
  dragging = true;
  const p = getPos(e);
  joyX = Math.max(-1, Math.min(1, p.x));
  joyY = Math.max(-1, Math.min(1, p.y));
  drawJoystick();
  publishCmd();
  cmdInterval = setInterval(publishCmd, 100);
});

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const p = getPos(e);
  joyX = Math.max(-1, Math.min(1, p.x));
  joyY = Math.max(-1, Math.min(1, p.y));
  drawJoystick();
});

window.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  joyX = 0; joyY = 0;
  drawJoystick();
  clearInterval(cmdInterval);
  cmdVelPub.publish({ linear: { x: 0, y: 0, z: 0 }, angular: { x: 0, y: 0, z: 0 } });
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  dragging = true;
  const p = getPos(e);
  joyX = Math.max(-1, Math.min(1, p.x));
  joyY = Math.max(-1, Math.min(1, p.y));
  drawJoystick();
  publishCmd();
  cmdInterval = setInterval(publishCmd, 100);
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!dragging) return;
  const p = getPos(e);
  joyX = Math.max(-1, Math.min(1, p.x));
  joyY = Math.max(-1, Math.min(1, p.y));
  drawJoystick();
});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  dragging = false;
  joyX = 0; joyY = 0;
  drawJoystick();
  clearInterval(cmdInterval);
  cmdVelPub.publish({ linear: { x: 0, y: 0, z: 0 }, angular: { x: 0, y: 0, z: 0 } });
});

document.getElementById('emergencyBtn').addEventListener('click', () => {
  cmdVelPub.publish({ linear: { x: 0, y: 0, z: 0 }, angular: { x: 0, y: 0, z: 0 } });
});

document.getElementById('speedSlider').addEventListener('input', e => {
  document.getElementById('speedLabel').textContent = parseFloat(e.target.value).toFixed(2);
});

drawJoystick();
</script>
</body>
</html>
