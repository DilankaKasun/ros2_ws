<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ecobot Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
h1 { font-size: 1.4rem; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.status-dot.connected { background: #00e676; box-shadow: 0 0 8px #00e67688; }
.status-dot.disconnected { background: #ff1744; }
.card { background: #16213e; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.card h2 { font-size: 1rem; margin-bottom: 8px; color: #90caf9; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #ffffff15; }
.stat-row:last-child { border: none; }
.stat-label { color: #90a4ae; }
.stat-value { font-family: 'Courier New', monospace; font-weight: bold; }
.badge { padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
.badge.cmd { background: #00c853; color: #000; }
.badge.rc { background: #ff6d00; color: #000; }
canvas { width: 100%; height: auto; border: 1px solid #ffffff22; border-radius: 4px; touch-action: none; }
.camera-frame { width: 100%; max-height: 360px; object-fit: contain; border-radius: 4px; border: 1px solid #ffffff22; background: #0d1b2a; display: block; }
.joystick-container { position: relative; width: 100%; aspect-ratio: 1; max-width: 200px; }
.joystick-container canvas { position: absolute; top: 0; left: 0; }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
button.emergency { background: #d50000; color: white; }
button.emergency:hover { background: #ff1744; }
input[type=range] { width: 100px; }
.camera-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 12px; align-items: start; }

.zone-bars { display: flex; gap: 4px; align-items: flex-end; padding: 4px 0; }
.zone-bar { flex: 1; border-radius: 4px 4px 0 0; min-height: 8px; transition: height 0.2s, background 0.2s; position: relative; }
.zone-bar-label { text-align: center; font-size: 0.65rem; margin-top: 2px; color: #90a4ae; }

.turning-indicator { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.turning-arrow { font-size: 2rem; line-height: 1; }
.turning-text { font-size: 1.1rem; font-weight: bold; text-transform: uppercase; }
.turning-forward { color: #00e676; }
.turning-left, .turning-right { color: #ffab00; }
.turning-stopped { color: #ff1744; }

.ws-indicator { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; margin-top: 4px; }
.ws-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.ws-dot.on { background: #00e676; }
.ws-dot.off { background: #ff1744; }

@media (max-width: 700px) { .camera-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1><span class="status-dot disconnected" id="statusDot"></span> ecobot</h1>

<div class="camera-grid">
  <div class="card">
    <h2>Camera Feed</h2>
    <canvas class="camera-frame" id="cameraCanvas" width="640" height="360"></canvas>
  </div>
  <div>
    <div class="card">
      <h2>Robot Status</h2>
      <div class="stat-row"><span class="stat-label">Position X</span><span class="stat-value" id="posX">0.00</span></div>
      <div class="stat-row"><span class="stat-label">Position Y</span><span class="stat-value" id="posY">0.00</span></div>
      <div class="stat-row"><span class="stat-label">Yaw</span><span class="stat-value" id="posYaw">0.00</span></div>
      <div class="stat-row"><span class="stat-label">Mode</span><span class="badge cmd" id="modeBadge">CMD</span></div>
    </div>
    <div class="card">
      <h2>Velocity</h2>
      <div class="stat-row"><span class="stat-label">Linear</span><span class="stat-value" id="velLinear">0.00</span></div>
      <div class="stat-row"><span class="stat-label">Angular</span><span class="stat-value" id="velAngular">0.00</span></div>
    </div>
  </div>
</div>

<div class="card">
  <h2>Obstacle Detection</h2>
  <div class="stat-row">
    <span class="stat-label">Turning Status</span>
    <span id="turningIndicator">
      <span class="turning-arrow">&#x2191;</span>
      <span class="turning-text turning-forward" id="turningText">FORWARD</span>
    </span>
  </div>
  <div style="margin-top: 8px;">
    <div class="stat-label" style="margin-bottom: 4px;">Zone Distances (m)</div>
    <div class="zone-bars" id="zoneBars">
      <div class="zone-bar" style="height:40px;background:#444;"><div class="zone-bar-label">Z1</div></div>
      <div class="zone-bar" style="height:40px;background:#444;"><div class="zone-bar-label">Z2</div></div>
      <div class="zone-bar" style="height:40px;background:#444;"><div class="zone-bar-label">Z3</div></div>
      <div class="zone-bar" style="height:40px;background:#444;"><div class="zone-bar-label">Z4</div></div>
      <div class="zone-bar" style="height:40px;background:#444;"><div class="zone-bar-label">Z5</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:6px;font-size:0.7rem;">
      <span style="color:#00e676;">&#x25A0; clear</span>
      <span style="color:#ffab00;">&#x25A0; warn</span>
      <span style="color:#ff1744;">&#x25A0; danger</span>
    </div>
  </div>
  <div class="ws-indicator">
    <span class="ws-dot off" id="wsDot"></span>
    <span id="wsLabel">Dashboard WS disconnected</span>
  </div>
</div>

<div class="card">
  <h2>Manual Control</h2>
  <div class="controls">
    <div class="joystick-container">
      <canvas id="joystickCanvas" width="200" height="200"></canvas>
    </div>
    <div>
      <div style="margin-bottom:8px">Speed: <span id="speedLabel">0.30</span></div>
      <input type="range" id="speedSlider" min="0.05" max="1.0" step="0.05" value="0.30">
    </div>
  </div>
  <div style="margin-top:8px">
    <button class="emergency" id="emergencyBtn">EMERGENCY STOP</button>
  </div>
</div>

<script>
var wsAddress = 'ws://' + location.hostname + ':8080/ws';
var dashboardWs = null;

var cameraCanvas = document.getElementById('cameraCanvas');
var cameraCtx = cameraCanvas.getContext('2d');
var camImage = new Image();

var wsDot = document.getElementById('wsDot');
var wsLabel = document.getElementById('wsLabel');
var zoneBars = document.getElementById('zoneBars');
var turningText = document.getElementById('turningText');
var turningArrow = document.getElementById('turningIndicator').querySelector('.turning-arrow');

var BAR_MAX_HEIGHT = 60;

function setWsConnected(connected) {
  wsDot.className = 'ws-dot ' + (connected ? 'on' : 'off');
  wsLabel.textContent = connected ? 'Dashboard WS connected' : 'Dashboard WS disconnected';
}

function connectDashboardWs() {
  if (dashboardWs) { dashboardWs.close(); }
  dashboardWs = new WebSocket(wsAddress);

  dashboardWs.onopen = function() {
    setWsConnected(true);
  };

  dashboardWs.onclose = function() {
    setWsConnected(false);
    setTimeout(connectDashboardWs, 3000);
  };

  dashboardWs.onerror = function() {
    setWsConnected(false);
  };

  dashboardWs.onmessage = function(evt) {
    var lines = evt.data.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (!line) continue;
      try {
        var msg = JSON.parse(line);
        handleWsMessage(msg);
      } catch(e) {}
    }
  };
}

function handleWsMessage(msg) {
  switch (msg.type) {
    case 'camera':
      camImage.onload = function() {
        var cw = cameraCanvas.width;
        var ch = cameraCanvas.height;
        var scale = Math.min(cw / camImage.width, ch / camImage.height);
        var dw = camImage.width * scale;
        var dh = camImage.height * scale;
        cameraCtx.fillStyle = '#0d1b2a';
        cameraCtx.fillRect(0, 0, cw, ch);
        cameraCtx.drawImage(camImage, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
      };
      camImage.src = 'data:image/jpeg;base64,' + msg.data;
      break;

    case 'odom':
      document.getElementById('posX').textContent = msg.data.x.toFixed(2);
      document.getElementById('posY').textContent = msg.data.y.toFixed(2);
      document.getElementById('posYaw').textContent = msg.data.yaw.toFixed(2);
      document.getElementById('velLinear').textContent = msg.data.linear.toFixed(2);
      document.getElementById('velAngular').textContent = msg.data.angular.toFixed(2);
      break;

    case 'mode':
      var badge = document.getElementById('modeBadge');
      if (msg.data.mode === 1) {
        badge.textContent = 'CMD';
        badge.className = 'badge cmd';
      } else {
        badge.textContent = 'RC';
        badge.className = 'badge rc';
      }
      break;

    case 'obstacles':
      var zones = msg.data.zones;
      var cmd = msg.data.turning;
      var safe = msg.data.safe_distance || 0.8;
      var warn = msg.data.warn_distance || 1.2;

      var bars = zoneBars.children;
      for (var j = 0; j < bars.length; j++) {
        var bar = bars[j];
        var d = j < zones.length ? zones[j] : 99.0;
        var h = Math.max(8, Math.min(BAR_MAX_HEIGHT, (d / 3.0) * BAR_MAX_HEIGHT));
        var color;
        if (d < safe) { color = '#ff1744'; }
        else if (d < warn) { color = '#ffab00'; }
        else { color = '#00e676'; }
        bar.style.height = h + 'px';
        bar.style.background = color;
        bar.querySelector('.zone-bar-label').textContent =
          (d < 10 ? d.toFixed(1) : '---') + 'm';
      }

      turningText.textContent = cmd;
      turningText.className = 'turning-text ' +
        (cmd === 'FORWARD' ? 'turning-forward' :
         cmd === 'STOPPED' ? 'turning-stopped' : 'turning-left');
      if (cmd === 'FORWARD') {
        turningArrow.innerHTML = '&#x2191;';
        turningArrow.className = 'turning-arrow turning-forward';
      } else if (cmd === 'TURN LEFT') {
        turningArrow.innerHTML = '&#x2190;';
        turningArrow.className = 'turning-arrow turning-left';
      } else if (cmd === 'TURN RIGHT') {
        turningArrow.innerHTML = '&#x2192;';
        turningArrow.className = 'turning-arrow turning-right';
      } else {
        turningArrow.innerHTML = '&#x2B1B;';
        turningArrow.className = 'turning-arrow turning-stopped';
      }
      break;
  }
}

connectDashboardWs();
</script>

<script>
var ROS_URL = 'ws://' + location.hostname + ':9090';
var ros = new ROSLIB.Ros({ url: ROS_URL });

ros.on('connection', function() {
  document.getElementById('statusDot').className = 'status-dot connected';
});
ros.on('close', function() {
  document.getElementById('statusDot').className = 'status-dot disconnected';
});
ros.on('error', function() {
  document.getElementById('statusDot').className = 'status-dot disconnected';
});

var cmdVelPub = new ROSLIB.Topic({
  ros: ros, name: '/cmd_vel', messageType: 'geometry_msgs/Twist'
});

var canvas = document.getElementById('joystickCanvas');
var ctx = canvas.getContext('2d');
var dragging = false;
var joyX = 0, joyY = 0;
var centerX = 100, centerY = 100, radius = 80;

function drawJoystick() {
  ctx.clearRect(0, 0, 200, 200);
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, Math.PI*2);
  ctx.fillStyle = '#0d1b2a';
  ctx.fill();
  ctx.strokeStyle = '#ffffff22';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(centerX + joyX * radius, centerY + joyY * radius, 20, 0, Math.PI*2);
  ctx.fillStyle = dragging ? '#66bbff' : '#4488cc';
  ctx.fill();
}

function getPos(e) {
  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width;
  var scaleY = canvas.height / rect.height;
  var cx = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
  var cy = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
  return { x: (cx * scaleX - centerX) / radius, y: (cy * scaleY - centerY) / radius };
}

function publishCmd() {
  var maxSpeed = parseFloat(document.getElementById('speedSlider').value);
  cmdVelPub.publish({
    linear: { x: -joyY * maxSpeed, y: 0, z: 0 },
    angular: { x: 0, y: 0, z: joyX * maxSpeed }
  });
}

var cmdInterval = null;

canvas.addEventListener('mousedown', function(e) {
  dragging = true;
  var p = getPos(e);
  joyX = Math.max(-1, Math.min(1, p.x));
  joyY = Math.max(-1, Math.min(1, p.y));
  drawJoystick();
  publishCmd();
  cmdInterval = setInterval(publishCmd, 100);
});

window.addEventListener('mousemove', function(e) {
  if (!dragging) return;
  var p = getPos(e);
  joyX = Math.max(-1, Math.min(1, p.x));
  joyY = Math.max(-1, Math.min(1, p.y));
  drawJoystick();
});

window.addEventListener('mouseup', function() {
  if (!dragging) return;
  dragging = false;
  joyX = 0; joyY = 0;
  drawJoystick();
  clearInterval(cmdInterval);
  cmdVelPub.publish({ linear: { x: 0, y: 0, z: 0 }, angular: { x: 0, y: 0, z: 0 } });
});

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  dragging = true;
  var p = getPos(e);
  joyX = Math.max(-1, Math.min(1, p.x));
  joyY = Math.max(-1, Math.min(1, p.y));
  drawJoystick();
  publishCmd();
  cmdInterval = setInterval(publishCmd, 100);
});

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!dragging) return;
  var p = getPos(e);
  joyX = Math.max(-1, Math.min(1, p.x));
  joyY = Math.max(-1, Math.min(1, p.y));
  drawJoystick();
});

canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  dragging = false;
  joyX = 0; joyY = 0;
  drawJoystick();
  clearInterval(cmdInterval);
  cmdVelPub.publish({ linear: { x: 0, y: 0, z: 0 }, angular: { x: 0, y: 0, z: 0 } });
});

document.getElementById('emergencyBtn').addEventListener('click', function() {
  cmdVelPub.publish({ linear: { x: 0, y: 0, z: 0 }, angular: { x: 0, y: 0, z: 0 } });
});

document.getElementById('speedSlider').addEventListener('input', function(e) {
  document.getElementById('speedLabel').textContent = parseFloat(e.target.value).toFixed(2);
});

drawJoystick();
</script>
</body>
</html>
