<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ecobot 3D Map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #fff; }
#scene-container { width: 100vw; height: 100vh; display: block; }
#hud {
  position: fixed; top: 12px; left: 12px; z-index: 10;
  background: rgba(10,10,30,0.85); border: 1px solid #334; border-radius: 8px;
  padding: 12px 18px; font-size: 13px; line-height: 1.6; min-width: 220px;
  backdrop-filter: blur(4px);
  pointer-events: none;
}
#hud h2 { font-size: 15px; color: #4fc3f7; margin-bottom: 6px; }
#hud .label { color: #889; }
#hud .value { color: #eee; font-family: 'Courier New', monospace; }
#hud .row { display: flex; justify-content: space-between; }
#hud .note { font-size: 11px; color: #667; margin-top: 4px; }
#toolbar {
  position: fixed; top: 12px; right: 12px; z-index: 10;
  display: flex; gap: 6px; flex-direction: column;
  pointer-events: none;
}
#toolbar a, #toolbar button {
  pointer-events: auto;
  color: #4fc3f7; text-decoration: none; font-size: 13px;
  background: rgba(10,10,30,0.85); border: 1px solid #334;
  border-radius: 6px; padding: 6px 14px; cursor: pointer;
  font-family: inherit; text-align: center;
}
#toolbar a:hover, #toolbar button:hover { background: rgba(30,30,60,0.9); }
#toolbar .active { background: rgba(30,60,90,0.9); border-color: #4fc3f7; }
#status {
  position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%); z-index: 10;
  background: rgba(10,10,30,0.85); border: 1px solid #334; border-radius: 8px;
  padding: 8px 18px; font-size: 13px; color: #889;
  backdrop-filter: blur(4px); text-align: center;
}
#controls-hint {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
  background: rgba(10,10,30,0.75); border: 1px solid #334; border-radius: 6px;
  padding: 6px 16px; font-size: 11px; color: #556;
  backdrop-filter: blur(4px);
}
#status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.dot-ok { background: #4caf50; box-shadow: 0 0 6px #4caf5066; }
.dot-err { background: #f44336; box-shadow: 0 0 6px #f4433666; }
.dot-wait { background: #ff9800; box-shadow: 0 0 6px #ff980066; }
</style>
</head>
<body>

<div id="hud">
  <h2><span id="statusDot" class="dot-wait"></span>3D Map</h2>
  <div class="row"><span class="label">Points</span><span class="value" id="pointCount">0</span></div>
  <div class="row"><span class="label">Robot</span><span class="value" id="robotPos">—</span></div>
  <div class="row"><span class="label">Yaw</span><span class="value" id="robotYaw">—</span></div>
  <div class="note" id="statusMsg">Move the robot to start mapping</div>
</div>

<div id="toolbar">
  <a href="/">&larr; Dashboard</a>
  <button id="followBtn" class="active">Follow: ON</button>
</div>

<div id="status"></div>
<div id="controls-hint">Drag to orbit &middot; Scroll to zoom &middot; Right-drag to pan</div>
<div id="scene-container"></div>

<script>
// ─── Scene setup ────────────────────────────────────────────────
const container = document.getElementById('scene-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(2, 1.5, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.update();

// ─── Lights ─────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x404060));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(5, 10, 7);
scene.add(dl);
scene.add(new THREE.DirectionalLight(0x8888ff, 0.3));

// ─── Grid ───────────────────────────────────────────────────────
const gridHelper = new THREE.GridHelper(20, 20, 0x446688, 0x334466);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.6;
scene.add(gridHelper);

// ─── Axes ───────────────────────────────────────────────────────
const axesHelper = new THREE.AxesHelper(0.5);
scene.add(axesHelper);

// ─── Follow mode ────────────────────────────────────────────────
let followMode = true;
let followBtn = document.getElementById('followBtn');
let userInteracted = false;

followBtn.addEventListener('click', () => {
  followMode = !followMode;
  followBtn.textContent = followMode ? 'Follow: ON' : 'Follow: OFF';
  followBtn.className = followMode ? 'active' : '';
  if (followMode) userInteracted = false;
});

controls.addEventListener('start', () => {
  if (followMode) {
    userInteracted = true;
  }
});

// ─── Point cloud ────────────────────────────────────────────────
let pointsMesh = null;

async function fetchPointCloud() {
  const statusMsg = document.getElementById('statusMsg');
  const statusEl = document.getElementById('status');
  try {
    const resp = await fetch('/map3d');
    if (!resp.ok) { statusMsg.textContent = 'Connecting...'; return; }
    const buf = await resp.arrayBuffer();
    if (buf.byteLength < 4) {
      statusMsg.textContent = 'Waiting for map data \u2014 move the robot';
      return;
    }
    const count = new Uint32Array(buf, 0, 1)[0];
    const data = new Float32Array(buf, 4, count * 6);

    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const off = i * 6;
      positions[i * 3]     = data[off];
      positions[i * 3 + 1] = data[off + 1];
      positions[i * 3 + 2] = data[off + 2];
      colors[i * 3]     = data[off + 3];
      colors[i * 3 + 1] = data[off + 4];
      colors[i * 3 + 2] = data[off + 5];
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
      size: 0.03, vertexColors: true, sizeAttenuation: true,
      transparent: true, opacity: 0.9,
    });

    if (pointsMesh) {
      scene.remove(pointsMesh);
      pointsMesh.geometry.dispose();
      pointsMesh.material.dispose();
    }
    pointsMesh = new THREE.Points(geom, mat);
    scene.add(pointsMesh);

    document.getElementById('pointCount').textContent = count.toLocaleString();
    statusMsg.textContent = 'Building map \u2014 keep moving';
    document.getElementById('statusDot').className = 'dot-ok';
  } catch (e) {
    document.getElementById('pointCount').textContent = '\u2014';
    document.getElementById('statusDot').className = 'dot-wait';
  }
}

fetchPointCloud();
setInterval(fetchPointCloud, 1000);

// ─── Robot marker ───────────────────────────────────────────────
const robotGroup = new THREE.Group();

const bodyGeom = new THREE.BoxGeometry(0.30, 0.08, 0.50);
const bodyMat = new THREE.MeshPhongMaterial({ color: 0x4fc3f7 });
const body = new THREE.Mesh(bodyGeom, bodyMat);
body.position.y = 0.04;
robotGroup.add(body);

const arrowGeom = new THREE.ConeGeometry(0.04, 0.12, 6);
const arrowMat = new THREE.MeshPhongMaterial({ color: 0xff5722 });
const arrow = new THREE.Mesh(arrowGeom, arrowMat);
arrow.position.set(0, 0.10, 0.25);
arrow.rotation.x = Math.PI / 2;
robotGroup.add(arrow);

const ringGeom = new THREE.RingGeometry(0.10, 0.22, 24);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0x4fc3f7, transparent: true, opacity: 0.25, side: THREE.DoubleSide,
});
const ring = new THREE.Mesh(ringGeom, ringMat);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.001;
robotGroup.add(ring);

scene.add(robotGroup);

// ─── Rosbridge ──────────────────────────────────────────────────
const ros = new ROSLIB.Ros({ url: 'ws://' + location.hostname + ':9090' });
let rosConnected = false;
ros.on('connection', () => { rosConnected = true; });
ros.on('close', () => { rosConnected = false; });

const odomSub = new ROSLIB.Topic({
  ros, name: '/odom', messageType: 'nav_msgs/msg/Odometry',
});

let lastRobotPos = { x: 0, y: 0 };
let mapInitPos = null;
let odomCount = 0;

odomSub.subscribe(function(msg) {
  const p = msg.pose.pose.position;
  const o = msg.pose.pose.orientation;
  const yaw = Math.atan2(2.0 * (o.w * o.z), 1.0 - 2.0 * (o.z * o.z));

  odomCount++;
  if (odomCount === 1) {
    mapInitPos = { x: p.x, y: p.y };
  }

  document.getElementById('robotPos').textContent =
    p.x.toFixed(2) + ', ' + p.y.toFixed(2);
  document.getElementById('robotYaw').textContent =
    (yaw * 180 / Math.PI).toFixed(1) + '\u00B0';

  // Position robot marker relative to initial odom zero
  const rx = p.x - (mapInitPos ? mapInitPos.x : 0);
  const ry = p.y - (mapInitPos ? mapInitPos.y : 0);
  robotGroup.position.set(rx, 0, ry);
  robotGroup.rotation.y = -yaw;
  lastRobotPos = { x: rx, y: ry };
});

// ─── Follow camera ──────────────────────────────────────────────
function updateFollow() {
  if (followMode && !userInteracted && rosConnected) {
    controls.target.lerp(
      new THREE.Vector3(lastRobotPos.x, 0, lastRobotPos.y), 0.05);
  }
}

// ─── Resize ─────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Animation loop ─────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  updateFollow();
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
