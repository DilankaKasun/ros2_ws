plant_mission_node:
  ros__parameters:
    # This node scans, photographs and reports. It does not drive:
    # ecobot_navigation's plant_run_node owns the wheels and asks for a
    # scan once it has parked the robot.

    # -- topics --
    plant_scan_cmd_topic: /ecobot/plant_scan_cmd
    plant_scan_status_topic: /ecobot/plant_scan_status
    scan_capture_topic: /ecobot/scan_capture
    scanner_cmd_topic: /arm/scanner_cmd
    scanner_status_topic: /arm/scanner_status
    wrist_camera_topic: /arm/camera/image_raw

    # -- where the arm aims when it sweeps --
    arm_scan_x: 0.30
    arm_scan_y: 0.0
    arm_scan_z: 0.50
    scan_samples: 6

    # -- capture timing --
    capture_delay_s: 1.2
    frame_max_age_s: 2.0
    # A scan ends when the ARM says it has ended. These two only catch an
    # arm that has gone quiet or plainly hung — they never cut a sweep
    # that is still reporting progress.
    scan_silence_timeout_s: 30.0
    scan_hard_timeout_s: 300.0

    # -- Gemini plant analysis --
    gemini_model: ''
    gemini_timeout_s: 20.0
    gemini_max_retries: 1
    jpeg_quality: 85
