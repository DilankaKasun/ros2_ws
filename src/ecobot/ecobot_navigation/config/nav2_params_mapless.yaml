amcl:
  ros__parameters:
    use_sim_time: False
    scan_topic: /scan_filtered
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: odom
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: 0.2
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_bt_xml_filename: navigate_to_pose_w_replanning_and_recovery.xml
    default_nav_through_poses_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins:
      - progress_checker
    goal_checker_plugins:
      - general_goal_checker
    controller_plugins:
      - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 5.0
    general_goal_checker:
      stateful: True
      plugin: nav2_controller::SimpleGoalChecker
      # xy_goal_tolerance deliberately left unchanged — see nav2_params.yaml
      # for the rationale (fixed arm-relative scan offset is the real
      # precision bottleneck, not Nav2).
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.08
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Tuned down for the plant-scan mission — see nav2_params.yaml for
      # the mapped-stack rationale; deltas here are smaller since this
      # mapless variant was already tuned more conservatively.
      desired_linear_vel: 0.18
      max_linear_accel: 0.25
      max_linear_decel: 0.4
      lookahead_dist: 0.4
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.03
      approach_velocity_scale: 1.0
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 5.0
      regulated_linear_scaling_min_velocity: 0.05
      regulated_linear_scaling_max_velocity: 0.18
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.3

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.15, -0.25], [-0.15, 0.25], [0.15, 0.25], [0.15, -0.25]]"
      plugins:
        - obstacle_layer
        - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: True
        obstacle_range: 3.0
        raytrace_range: 3.5
        observation_sources: scan ground_obstacles yolo_obstacles
        scan:
          topic: /scan_filtered
          max_obstacle_height: 1.0
          clearing: True
          marking: True
          min_obstacle_height: 0.05
          obstacle_max_range: 3.0
          obstacle_min_range: 0.16
          inf_is_valid: false
        ground_obstacles:
          topic: /ground_obstacle_points
          sensor_frame: base_footprint
          data_type: PointCloud2
          min_obstacle_height: 0.0
          max_obstacle_height: 0.50
          obstacle_max_range: 3.0
          marking: True
          clearing: False
          inf_is_valid: false
        yolo_obstacles:
          topic: /yolo_obstacle_points
          sensor_frame: camera_depth_optical_frame
          data_type: PointCloud2
          min_obstacle_height: 0.0
          max_obstacle_height: 0.50
          obstacle_max_range: 3.0
          marking: True
          clearing: False
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      footprint: "[[-0.15, -0.25], [-0.15, 0.25], [0.15, 0.25], [0.15, -0.25]]"
      plugins:
        - obstacle_layer
        - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: True
        obstacle_range: 3.0
        raytrace_range: 3.5
        observation_sources: scan ground_obstacles yolo_obstacles
        scan:
          topic: /scan_filtered
          max_obstacle_height: 1.0
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          obstacle_max_range: 3.0
          obstacle_min_range: 0.16
          inf_is_valid: false
        ground_obstacles:
          topic: /ground_obstacle_points
          sensor_frame: base_footprint
          data_type: PointCloud2
          min_obstacle_height: 0.0
          max_obstacle_height: 0.50
          obstacle_max_range: 3.0
          marking: True
          clearing: False
          inf_is_valid: false
        yolo_obstacles:
          topic: /yolo_obstacle_points
          sensor_frame: camera_depth_optical_frame
          data_type: PointCloud2
          min_obstacle_height: 0.0
          max_obstacle_height: 0.50
          obstacle_max_range: 3.0
          marking: True
          clearing: False
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins:
      - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.15
      use_astar: false

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/footprint
    cycle_frequency: 10.0
    behavior_plugins:
      - spin
      - backup
      - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
